# Despliegue de trazev.com (servidor dedicado, Hetzner CX23).
# Uso: docker compose --env-file .env.production up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trazev_web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - trazev_net
    # Sin "ports": no se expone directamente, solo a través de Caddy.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: trazev_proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - trazev_net
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trazev_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
