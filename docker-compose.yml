# Despliegue de trazev.com (servidor dedicado, Hetzner CX23).
# Uso: docker compose --env-file .env.production up -d --build

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trazev_web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      # Docker define automaticamente $HOSTNAME dentro del contenedor (el id del propio
      # contenedor); el server.js standalone de Next.js lo usa para decidir en que interfaz
      # escuchar, y esa HOSTNAME resuelve solo a la IP del contenedor en la red de Docker,
      # no a localhost. Sin forzar esto a 0.0.0.0, ni el healthcheck ni nada que conecte por
      # localhost/127.0.0.1 puede llegar a la app, aunque el proceso este vivo.
      HOSTNAME: "0.0.0.0"
    networks:
      - trazev_net
    # Sin "ports": no se expone directamente, solo a través de Caddy.
    healthcheck:
      # node en vez de wget/curl: la imagen node:20-alpine no garantiza tenerlos instalados,
      # pero node sí (es la propia imagen base) — evita que el healthcheck falle solo por
      # falta del binario, independientemente de si la app arrancó bien o no.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: trazev_proxy
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - trazev_net
    deploy:
      resources:
        limits:
          memory: 128m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  trazev_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
